name: Deploy

# Releases created with GITHUB_TOKEN do not emit release:published to other
# workflows (GitHub recursion guard). Listen for a successful Release run instead.
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag (git SHA or semver tag)
        required: true
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check deploy configuration
        id: config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: set DEPLOY_SSH_KEY, DEPLOY_HOST_PROD, and DEPLOY_USER repository secrets when the VPS is ready."
            echo "See docs/github-deploy-setup.md for the full checklist."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        if: steps.config.outputs.skip != 'true'
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.image_tag }}
          FALLBACK_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG:-}"
            if [[ -z "$TAG" ]]; then
              TAG="${FALLBACK_SHA}"
            fi
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # Release is triggered via workflow_run, so this job's workflow_run.head_sha is the
            # default-branch tip — which can diverge from the v* commit Docker published
            # (e.g. after amend/rebase). Use the GitHub Release target commit instead.
            TAG="$(gh release view --repo "$REPO" --json targetCommitish,tagName \
              --jq 'if (.targetCommitish | test("^[0-9a-f]{40}$")) then .targetCommitish else (.tagName | ltrimstr("v")) end')"
            if [[ -z "$TAG" ]]; then
              echo "Could not resolve IMAGE_TAG from latest GitHub Release" >&2
              exit 1
            fi
          else
            TAG="${FALLBACK_SHA}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Could not resolve IMAGE_TAG for event=${EVENT_NAME}" >&2
            exit 1
          fi

          echo "Deploying IMAGE_TAG=${TAG} (event=${EVENT_NAME})"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.config.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/nerdik}"
            IMAGE_TAG=${{ steps.tag.outputs.value }} ./scripts/vps-deploy.sh

      - name: Smoke check
        if: steps.config.outputs.skip != 'true' && vars.PROD_APP_URL != ''
        run: curl -fsS "${{ vars.PROD_APP_URL }}/up"
