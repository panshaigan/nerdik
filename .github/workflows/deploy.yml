name: Deploy

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag (git SHA or semver tag)
        required: true
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check deploy configuration
        id: config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: set DEPLOY_SSH_KEY, DEPLOY_HOST_PROD, and DEPLOY_USER repository secrets when the VPS is ready."
            echo "See docs/github-deploy-setup.md for the full checklist."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        if: steps.config.outputs.skip != 'true'
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.image_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG:-}"
            if [[ -z "$TAG" ]]; then
              TAG="${RELEASE_SHA}"
            fi
          else
            # release: published — deploy the immutable GHCR SHA tag for this release commit
            TAG="${RELEASE_SHA}"
          fi

          echo "Deploying IMAGE_TAG=${TAG} (event=${EVENT_NAME})"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.config.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/nerdik}"
            IMAGE_TAG=${{ steps.tag.outputs.value }} ./scripts/vps-deploy.sh --no-pull

      - name: Smoke check
        if: steps.config.outputs.skip != 'true' && vars.PROD_APP_URL != ''
        run: curl -fsS "${{ vars.PROD_APP_URL }}/up"
