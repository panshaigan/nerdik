[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .

; Defense-in-depth for PHP engine RCEs (php2shell + 2026-11-19 advisories).
; Important while Sail PPA may still be on 8.5.12; see docs/security.md.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
zend.exception_ignore_args = 1

