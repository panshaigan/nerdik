[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .

; PHP2Shell mitigations (CVE-2026-109618 / CVE-2026-109619 / CVE-2026-115560).
; Keep until the next regular PHP bugfix after 8.5.12.
; https://www.php.net/archive/2026.php#2026-10-21-5
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

