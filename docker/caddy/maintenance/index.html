    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Nerdik — Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: oklch(0.722 0.126 225.422);
            --primary-dark: oklch(0.6 0.126 225.422);
            --base-100: oklch(97% 0.015 242);
            --base-200: oklch(94% 0.02 242);
            --base-content: oklch(25% 0.04 242);
            --muted: oklch(45% 0.03 242);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
            background: var(--base-100);
            color: var(--base-content);
            line-height: 1.6;
        }

        .card {
            max-width: 28rem;
            width: 100%;
            text-align: center;
            padding: 2.5rem 2rem;
            background: white;
            border-radius: 1rem;
            border: 1px solid var(--base-200);
            box-shadow: 0 4px 24px oklch(25% 0.04 242 / 0.08);
        }

        .logo {
            display: block;
            margin: 0 auto 1.5rem;
            width: 4rem;
            height: 4rem;
            color: var(--primary);
        }

        h1 {
            font-family: 'Cinzel', ui-serif, Georgia, serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--base-content);
        }

        p {
            color: var(--muted);
            font-size: 1rem;
        }

        .spinner {
            margin: 1.75rem auto 0;
            width: 2rem;
            height: 2rem;
            border: 3px solid var(--base-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
